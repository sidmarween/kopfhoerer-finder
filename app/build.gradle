plugins { id 'com.android.application' }
android {
    namespace 'de.marween.btfinder'
    compileSdk 35
    defaultConfig {
        applicationId 'de.marween.btfinder'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file('finder.keystore')
            storePassword 'finder-marween'
            keyAlias 'finder'
            keyPassword 'finder-marween'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
